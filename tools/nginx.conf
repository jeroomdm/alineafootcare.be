server {
    # Beveiligingsheaders (serverniveau)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://stats.havenlicht.be 'sha256-kEq3e0KoQhmVi9duYou9jMvL1ehG3txw+2hot5nJC0M='; style-src 'self'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://stats.havenlicht.be; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html index.htm;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml text/xml image/svg+xml image/x-icon;

    # Interne bestanden niet publiek
    location ~ (^/\.|^/README\.md$|^/tools/|^/social/|^/bron/) { return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
